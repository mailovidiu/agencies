name: govt_departments_and_agencies
description: "Directory of U.S. Government Departments and Agencies"
publish_to: "none"

version: 3.0.4+21

environment:
  sdk: ^3.6.0
dependencies:
  app_tracking_transparency: ^2.0.7
  package_info_plus: ^9.0.0
  change_app_package_name: ^1.0.0
  google_mobile_ads: ^9.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  cloud_firestore: ^6.9.0
  firebase_core: ^4.1.1
  firebase_analytics: ^12.0.0
  firebase_auth: '>=5.3.3'
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^18.0.1
  google_maps_flutter: ^2.18.0
  geolocator: ^11.1.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.6
  provider: ^6.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  remove_alpha_ios: true
